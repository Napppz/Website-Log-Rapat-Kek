<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Use Case Diagram Standar - Aplikasi Log Book Kegiatan KEK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    svg {
      background: #FFFFFF;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <svg width="1050" height="980" viewBox="0 0 1050 980" xmlns="http://www.w3.org/2000/svg">
    <!-- Title Banner -->
    <rect x="50" y="16" width="950" height="42" rx="8" fill="#215865" stroke="#183E47" stroke-width="1.5"/>
    <text x="525" y="42" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Use Case Diagram: Aplikasi Log Book Kegiatan — Setjen DN KEK RI
    </text>

    <!-- Subsystem Boundary -->
    <rect x="330" y="76" width="390" height="880" rx="2" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <text x="350" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748B">«subsystem»</text>
    <text x="350" y="124" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Aplikasi Log Book Kegiatan KEK</text>

    <!-- 12 Use Case Ellipses -->
    <!-- UC 01 -->
    <ellipse id="uc01" cx="525" cy="172" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="177" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Login &amp; Autentikasi Sistem</text>

    <!-- UC 02 -->
    <ellipse id="uc02" cx="525" cy="236" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="241" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Lihat Dashboard &amp; Kalender Kegiatan</text>

    <!-- UC 03 -->
    <ellipse id="uc03" cx="525" cy="300" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="305" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Filter &amp; Pencarian Log Book Kegiatan</text>

    <!-- UC 04 -->
    <ellipse id="uc04" cx="525" cy="364" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="369" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Unduh Berkas &amp; Laporan Rekapitulasi</text>

    <!-- UC 05 -->
    <ellipse id="uc05" cx="525" cy="428" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="433" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Pembaruan Status Progres (3 Tahapan)</text>

    <!-- UC 06 -->
    <ellipse id="uc06" cx="525" cy="492" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="497" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Pencatatan &amp; Penjadwalan Kegiatan Baru</text>

    <!-- UC 07 -->
    <ellipse id="uc07" cx="525" cy="556" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="561" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Pengelolaan Daftar Pihak Terkait</text>

    <!-- UC 08 -->
    <ellipse id="uc08" cx="525" cy="620" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="625" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Pencatatan Dokumen Log Book Kegiatan</text>

    <!-- UC 09 -->
    <ellipse id="uc09" cx="525" cy="684" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="689" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Pencatatan Ringkasan Hasil Kegiatan</text>

    <!-- UC 10 -->
    <ellipse id="uc10" cx="525" cy="748" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="753" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Pengelolaan Matriks Tindak Lanjut &amp; PIC</text>

    <!-- UC 11 -->
    <ellipse id="uc11" cx="525" cy="812" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="817" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Monitoring Kinerja 3 Tim Kerja KEK</text>

    <!-- UC 12 -->
    <ellipse id="uc12" cx="525" cy="876" rx="142" ry="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
    <text x="525" y="881" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Kelola Master Pengguna &amp; Hak Akses</text>

    <!-- ACTOR 1: STAF PELAKSANA (Top Left) -->
    <!-- Head -->
    <circle cx="170" cy="250" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <!-- Body -->
    <line x1="170" y1="264" x2="170" y2="295" stroke="#1E293B" stroke-width="2"/>
    <!-- Arms -->
    <line x1="145" y1="275" x2="195" y2="275" stroke="#1E293B" stroke-width="2"/>
    <!-- Legs -->
    <line x1="170" y1="295" x2="150" y2="325" stroke="#1E293B" stroke-width="2"/>
    <line x1="170" y1="295" x2="190" y2="325" stroke="#1E293B" stroke-width="2"/>
    <!-- Label -->
    <text x="170" y="345" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Staf Pelaksana</text>
    <text x="170" y="360" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">(Pegawai / PIC)</text>

    <!-- ACTOR 2: ADMIN BIRO / TIM (Bottom Left) -->
    <!-- Head -->
    <circle cx="170" cy="580" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <!-- Body -->
    <line x1="170" y1="594" x2="170" y2="625" stroke="#1E293B" stroke-width="2"/>
    <!-- Arms -->
    <line x1="145" y1="605" x2="195" y2="605" stroke="#1E293B" stroke-width="2"/>
    <!-- Legs -->
    <line x1="170" y1="625" x2="150" y2="655" stroke="#1E293B" stroke-width="2"/>
    <line x1="170" y1="625" x2="190" y2="655" stroke="#1E293B" stroke-width="2"/>
    <!-- Label -->
    <text x="170" y="675" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Admin Biro / Tim</text>
    <text x="170" y="690" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">(Pengelola Log Book Kegiatan)</text>

    <!-- ACTOR 3: SUPER ADMIN (Right Middle) -->
    <!-- Head -->
    <circle cx="880" cy="490" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <!-- Body -->
    <line x1="880" y1="504" x2="880" y2="535" stroke="#1E293B" stroke-width="2"/>
    <!-- Arms -->
    <line x1="855" y1="515" x2="905" y2="515" stroke="#1E293B" stroke-width="2"/>
    <!-- Legs -->
    <line x1="880" y1="535" x2="860" y2="565" stroke="#1E293B" stroke-width="2"/>
    <line x1="880" y1="535" x2="900" y2="565" stroke="#1E293B" stroke-width="2"/>
    <!-- Label -->
    <text x="880" y="585" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Super Admin</text>
    <text x="880" y="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">(Pimpinan Setjen)</text>

    <!-- ASSOCIATIONS: STAF PELAKSANA (Left Top -> UC 01..05) -->
    <!-- Target left edge of ellipse: cx - rx = 525 - 142 = 383 -->
    <line x1="195" y1="275" x2="383" y2="172" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="275" x2="383" y2="236" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="275" x2="383" y2="300" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="275" x2="383" y2="364" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="275" x2="383" y2="428" stroke="#1E293B" stroke-width="1.5"/>

    <!-- ASSOCIATIONS: ADMIN BIRO / TIM (Left Bottom -> UC 06..10) -->
    <line x1="195" y1="605" x2="383" y2="492" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="605" x2="383" y2="556" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="605" x2="383" y2="620" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="605" x2="383" y2="684" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="195" y1="605" x2="383" y2="748" stroke="#1E293B" stroke-width="1.5"/>

    <!-- ASSOCIATIONS: SUPER ADMIN (Right Middle -> UC 01, 02, 04, 09, 10, 11, 12) -->
    <!-- Target right edge of ellipse: cx + rx = 525 + 142 = 667 -->
    <line x1="855" y1="515" x2="667" y2="172" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="855" y1="515" x2="667" y2="236" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="855" y1="515" x2="667" y2="364" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="855" y1="515" x2="667" y2="684" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="855" y1="515" x2="667" y2="748" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="855" y1="515" x2="667" y2="812" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="855" y1="515" x2="667" y2="876" stroke="#1E293B" stroke-width="1.5"/>
  </svg>
</body>
</html>
